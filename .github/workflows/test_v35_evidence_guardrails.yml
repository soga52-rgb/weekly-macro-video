name: Test V35 evidence guardrails

on:
  pull_request:
    paths:
      - "scripts/macro_v35_diagnosis.py"
      - "scripts/00_fetch_weekly_news_context.py"
      - "scripts/01_generate_weekly_forest_summary.py"
      - "tests/test_v35_evidence_guardrails.py"
      - ".github/workflows/test_v35_evidence_guardrails.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax and regression tests
        run: |
          python -m py_compile scripts/macro_v35_diagnosis.py scripts/00_fetch_weekly_news_context.py scripts/01_generate_weekly_forest_summary.py
          python -m unittest discover -s tests -p 'test_v35_evidence_guardrails.py' -v
